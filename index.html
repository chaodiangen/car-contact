<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>挪车联系 · 一键拨号</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f0f4f8;
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }
        .card {
            background: white;
            border-radius: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            padding: 40px 24px;
            text-align: center;
        }
        .car-icon {
            font-size: 64px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 28px;
            color: #1e293b;
            margin: 0 0 8px;
        }
        .sub {
            color: #64748b;
            margin-bottom: 32px;
        }
        .phone-number {
            background: #eef2ff;
            border-radius: 50px;
            padding: 20px;
            font-size: 28px;
            font-weight: 700;
            color: #1e3a8a;
            border: 2px solid #a5b4fc;
            margin: 20px 0;
        }
        .call-button {
            display: block;
            background: #22c55e;
            color: white;
            text-decoration: none;
            padding: 20px;
            border-radius: 50px;
            font-size: 24px;
            font-weight: 600;
            box-shadow: 0 8px 0 #15803d;
            transition: 0.1s;
            margin: 20px 0;
        }
        .call-button:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 #15803d;
        }
        .hint {
            color: #64748b;
            font-size: 14px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 40px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="car-icon">🚗</div>
        <h1>需要挪车</h1>
        <div class="sub">请直接联系车主</div>

        <div class="phone-number" id="phoneDisplay">📞 138-0000-1111</div>

        <a href="tel:13800001111" id="callLink" class="call-button">
            📲 点击直接呼叫
        </a>

        <div class="hint">
            点击上方按钮即可拨打，无需手动输入号码
        </div>
    </div>

    <script>
        // 在这里填写你的真实手机号（仅数字，不要有横线）
        const YOUR_PHONE = "13800001111";  // ← 修改为你的号码

        // 格式化显示（加横线更好看）
        function formatPhone(phone) {
            if (phone.length === 11) {
                return phone.slice(0,3) + '-' + phone.slice(3,7) + '-' + phone.slice(7);
            }
            return phone;
        }

        document.getElementById('phoneDisplay').innerText = '📞 ' + formatPhone(YOUR_PHONE);
        document.getElementById('callLink').href = 'tel:' + YOUR_PHONE;
    </script>
</body>
</html>

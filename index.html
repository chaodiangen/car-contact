<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>挪车联系</title>
    <style>
        body { text-align: center; font-family: system-ui; padding: 20px; background: #f5f7fa; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: white; border-radius: 32px; padding: 32px 24px; max-width: 320px; width: 100%; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        h2 { font-size: 24px; margin: 0 0 8px; color: #1e293b; }
        .tip { color: #64748b; font-size: 14px; margin-bottom: 32px; }
        button { background: #007aff; color: white; font-size: 20px; font-weight: 600; padding: 14px 20px; border: none; border-radius: 60px; width: 100%; cursor: pointer; transition: background 0.2s; }
        button:active { background: #005fc9; }
        .footer { margin-top: 32px; font-size: 12px; color: #94a3b8; }
        .error { color: #e53e3e; margin-top: 16px; font-size: 14px; display: none; }
    </style>
</head>
<body>
<div class="card">
    <h2>📞 挪车请联系车主</h2>
    <div class="tip">点击按钮，即可通过隐私号码联系车主</div>
    <button id="callBtn">📱 拨打电话</button>
    <div class="error" id="errorMsg">获取号码失败，请稍后重试</div>
    <div class="footer">您的通话将保护双方隐私</div>
</div>

<script>
    document.getElementById('callBtn').onclick = async function() {
        const btn = this;
        btn.disabled = true;
        btn.innerText = '加载中...';
        try {
            const response = await fetch('/api/phone');
            if (!response.ok) throw new Error('网络错误');
            const data = await response.json();
            if (data.phone) {
                window.location.href = 'tel:' + data.phone;
            } else {
                throw new Error('未获取到号码');
            }
        } catch (err) {
            document.getElementById('errorMsg').style.display = 'block';
            btn.disabled = false;
            btn.innerText = '📱 拨打电话';
        }
    };
</script>
</body>
</html>
